version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      # First-match wins: TypeScript majors route here and stay isolated
      # while the compiler major is held pending compatible tooling.
      typescript-major:
        patterns:
          - "typescript"
        update-types:
          - "major"
      # TypeScript minor/patch updates remain eligible in a separate group.
      typescript-compatible:
        patterns:
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "typescript"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
